[project]
name = "ragchatbot"
version = "1.0.0"
description = "Local RAG pipeline with vector search, query expansion, and a GCP-Console-style web UI."
requires-python = ">=3.10"
authors = [{ name = "Anushka Singh" }]
license = { text = "MIT" }

dependencies = [
  "flask>=3.0.3",
  "jinja2>=3.1.4",
  "torch>=2.2,<2.6",
  "sentence-transformers>=3.0.1,<4.0",
  "numpy>=1.26.4",
  "faiss-cpu>=1.8.0",
  "rank-bm25>=0.2.2",
  "pypdf>=4.3.1",
  "python-docx>=1.1.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "langfuse>=2.43.3",
  "structlog>=24.4.0",
  "requests>=2.32.3",
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "reportlab>=4.5.1",
  "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[project.scripts]
ragchatbot = "public.index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "public"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
